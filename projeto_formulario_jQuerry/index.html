<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas 2025</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Bloco de tarefas</h1>
    </header>
    <div class="form-task">     
        <form>
            <button type="reset">Cancelar</button>
            <input type="text" id="new-task" required placeholder="Nova tarefa">
            <button type="submit" id="Add-task">Adicionar</button>
        </form>
    </div>
    <div class="list-task">
        <ul class="my-task">
            
        </ul>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="./main.js"></script>
</body>
</html>
